all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  children:
    trust_layer:
      hosts:
        authentik:
          ansible_host: <AUTHENTIK_IP>
        openbao:
          ansible_host: <OPENBAO_IP>
